apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wgvia-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "WGVIA",
        "GameProviderConfiguration": "WGVIAConfiguration",
        "IntervalDays": 2,
        "IntervalDaysMax": 30,
        "IntervalDaysMinimum": 1
      },
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameProvidersBaseUrl": "http://game-gameproviders/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
