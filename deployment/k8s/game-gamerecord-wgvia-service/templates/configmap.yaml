apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wgvia-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "WGVIA",
        "GameProviderConfiguration": "WGVIAConfiguration",
        "IntervalDays": 2,
        "IntervalDaysMax": 30,
        "IntervalDaysMinimum": 1
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameProvidersBaseUrl": "http://game-gameproviders/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
