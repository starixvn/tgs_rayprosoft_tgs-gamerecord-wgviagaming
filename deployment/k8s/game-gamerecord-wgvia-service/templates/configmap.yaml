apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wgvia-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules",
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameProvidersBaseUrl": "http://game-gameproviders"
      },
      "GameRecordInfo": {
        "GameProviderCode": "WGFM",
        "GameProviderConfiguration": "WGFMConfiguration",
        "IntervalDayMax": 30,
        "IntervalDay": 2
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
